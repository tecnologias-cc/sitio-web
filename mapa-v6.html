<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141817"><title>Casa Cortés | Nuestra esencia en el mundo</title><link rel="stylesheet" href="mapa-v6.css"></head>
<body><main class="shell embedded-shell">
<section class="map-section" aria-label="Mapa interactivo mundial"><div class="countries-header"><h2 id="countries-heading">Presencia Global</h2><span id="count">15 países</span></div><div class="countries" id="countries" aria-label="Seleccionar país"></div><div class="map-frame"><div class="map-top"><button id="reset" type="button" aria-label="Regresar al mapa mundial">↗ Ver mundo completo</button></div><div class="map-holder"><svg id="map" role="img" aria-label="Mapa mundial interactivo con países destacados" viewBox="0 0 1000 390" preserveAspectRatio="xMidYMid meet"><g id="map-layer"></g><g id="map-callout" aria-hidden="true" style="display:none"><path id="callout-line"/><circle id="callout-point" r="4"/><foreignObject id="callout-box" width="230" height="86"><div xmlns="http://www.w3.org/1999/xhtml" class="map-card"><span id="callout-country"></span><strong id="callout-name"></strong></div></foreignObject></g></svg><div class="loading" id="loading" role="status">Cargando fronteras geográficas…</div></div></div><nav class="regions" aria-label="Seleccionar región"><button class="region active" data-region="world">Todo el mundo</button><button class="region" data-region="america">América</button><button class="region" data-region="europe">Europa</button><button class="region" data-region="asia">Asia</button><button class="region" data-region="oceania">Oceanía</button></nav></section></main>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script><script src="mapa-v6.js"></script></body></html>
